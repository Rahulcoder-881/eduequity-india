  "@expo/ngrok-bin>@expo/ngrok-bin-win32-x64": "-"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.1"

  # ===== SECURITY FIXES =====
  # [HIGH] fast-uri path-traversal + host-confusion
  #   GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx
  fast-uri: ">=4.1.3"
  # [HIGH] browserslist unbounded memory growth and unsafe custom stats handling
  #   GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx
  browserslist: ">=4.28.7"
  # [MED] baseline-browser-mapping invalid-input process termination
  #   GHSA-w5vr-8v7q-w6rv
  baseline-browser-mapping: ">=2.11.0"
  # [HIGH+MED] ip-address SSRF classification bypasses
  #   GHSA-mwp4-54f8-5fhr, GHSA-22jq-vg5j-6vgg, GHSA-4xrf-jv44-h6hh
  ip-address: ">=10.3.1"
  # [HIGH] nanoid custom generator can loop indefinitely with zero size
  #   GHSA-2v37-7h3g-55p8
  nanoid: ">=3.3.18"
  # [HIGH+MED] lodash prototype pollution + code injection via _.template
  #   GHSA-r5fr-rjxr-66jc (CVE-2026-2950), GHSA-f23m-r3pf-42rh
  lodash: ">=4.18.0"
  # [HIGH+MED] path-to-regexp ReDoS via sequential optional groups
  #   GHSA-j3q9-mxjg-w52f, GHSA-27v5-c462-wpq7
  path-to-regexp: ">=8.4.0"
  # [HIGH+MED] picomatch ReDoS via extglob quantifiers — two installed majors
  #   GHSA-c2c7-rcm5-vvqj, GHSA-3v7f-55p6-f55p
  "picomatch@<3": "2.3.2"
  "picomatch@>=4": "4.0.4"
  # [HIGH+MED] brace-expansion DoS via exponential-time / zero-step expansion
  #   GHSA-mh99-v99m-4gvg, GHSA-3jxr-9vmj-r5cp
  brace-expansion: ">=2.1.2"
  # [MED] d3-color ReDoS
  #   GHSA-36jr-mh4h-2g58
  d3-color: ">=3.1.0"
  # [HIGH] postcss path traversal via sourceMappingURL auto-loading
  #   GHSA-r28c-9q8g-f849
  postcss: ">=8.5.18"
  # [MED] qs crash via null entries in comma-format arrays
  #   GHSA-q8mj-m7cp-5q26
  qs: ">=6.16.0"
  # [MED] yaml stack overflow via deeply nested collections
  #   GHSA-48c2-rrv3-qjmp
  yaml: ">=2.8.3"
  # [HIGH+MED] vite `server.fs.deny` bypass + NTLMv2 hash disclosure via launch-editor
  #   GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3
  vite: ">=7.3.5"
  # [MED] markdown-it quadratic complexity DoS in smartquotes rule
  #   GHSA-6v5v-wf23-fmfq
  markdown-it: ">=14.2.0"
  # [HIGH] js-yaml quadratic CPU via YAML merge-key chains
  #   GHSA-52cp-r559-cp3m
  js-yaml: ">=4.3.0"
  # [HIGH] linkify-it quadratic DoS via mailto: scan-loop
  #   GHSA-v245-v573-v5vm
  linkify-it: ">=5.0.2"
  # [LOW] body-parser DoS when invalid limit value silently disables size enforcement
  #   GHSA-v422-hmwv-36x6
  body-parser: ">=2.3.0"
  # [LOW] @babel/core arbitrary file read via sourceMappingURL comment
  #   GHSA-4x5r-pxfx-6jf8
  "@babel/core": ">=7.29.6"